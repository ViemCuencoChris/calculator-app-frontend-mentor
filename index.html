<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Calculator app</title>
</head>
<body>
  <main class="calculator">
    <section class="calculator-heading">
      <h1 class="calculator-desc">calc</h1>
      <div class="theme">
        <h2 class="theme-desc">THEME</h2>
        <h3 class="theme-num">1</h3>
        <h3 class="theme-num">2</h3>
        <h3 class="theme-num">3</h3>
        <div class="selection-slider"><div class="circle"></div></div>
      </div>
    </section>

    <input type="text" class="main-screen" placeholder="0" readonly>
    <section class="main-keys">
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn deleteBtn" id="deleteBtn">DEL</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn">+</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn">-</button>
      <button class="btn">.</button>
      <button class="btn">0</button>
      <button class="btn">/</button>
      <button class="btn">x</button>
      <button class="btn resetBtn" id="resetBtn">RESET</button>
      <button class="btn submitBtn" id="submitBtn">=</button>
    </section>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>

  <script src="main.js"></script>
</body>
</html>
