<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Calculator app</title>
</head>
<body>
  <div class="calculator">
    <div class="calculator-heading">
      <h1 class="calculator-desc">calc</h1>
      <div class="theme">
        <h2 class="theme-desc">THEME</h2>
        <h3 class="theme-num">1</h3>
        <h3 class="theme-num">2</h3>
        <h3 class="theme-num">3</h3>
        <div class="selection-slider"><div class="circle"></div></div>
      </div>
    </div>

    <input type="text" class="main-screen">
    <section class="main-keys">
      <div class="btn">7</div>
      <div class="btn">8</div>
      <div class="btn">9</div>
      <div id="deleteBtn">DEL</div>
      <div class="btn">4</div>
      <div class="btn">5</div>
      <div class="btn">6</div>
      <div class="btn">+</div>
      <div class="btn">1</div>
      <div class="btn">2</div>
      <div class="btn">3</div>
      <div class="btn">-</div>
      <div class="btn">.</div>
      <div class="btn">0</div>
      <div class="btn">/</div>
      <div class="btn">x</div>
      <div id="resetBtn">RESET</div>
      <div id="submitBtn">=</div>
    </section>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>

  <script src="main.js"></script>
</body>
</html>
